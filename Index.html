<!DOCTYPE html>
<html dir="rtl">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --border: #e0e0e0;
      --row-alt: #fafafa;
    }
    * { box-sizing: border-box; }
    /* the hidden attribute must always win, even over display:flex classes
       like .login-view / .summary-panel */
    [hidden] { display: none !important; }
    html, body {
      direction: rtl;
    }
    body {
      font-family: 'Google Sans', Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f5f6f8;
      color: #222;
      text-align: start;
    }
    h1 {
      font-size: 20px;
      margin: 0;
      color: #333;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .refresh-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: #fff;
      color: #444;
      cursor: pointer;
      padding: 0;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .refresh-btn:hover {
      background: #f0f4ff;
      color: #1a73e8;
    }
    .refresh-btn svg {
      transition: transform 0.4s ease;
    }
    .refresh-btn.spinning svg {
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .filter-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #444;
    }
    .filter-box select {
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      font-size: 13px;
      color: #222;
      min-width: 160px;
      cursor: pointer;
    }
    .tab-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab-btn {
      border: none;
      padding: 10px 18px;
      border-radius: 8px 8px 0 0;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }
    .tab-btn:hover {
      opacity: 0.9;
    }
    .tab-btn.active {
      opacity: 1;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .table-wrap {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .table-section {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .table-section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      color: #333;
      background: #f5f6f8;
      border-bottom: 1px solid var(--border);
    }
    .count-badge {
      background: #e3e6ea;
      color: #444;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 10px;
    }
    .count-badge-done { background: #e6f4ea; color: #1e8e3e; }   /* طباعة — green */
    .count-badge-sent { background: #e8eaf6; color: #000080; }   /* أنجاز — navy */
    .done-pager {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      padding: 8px 14px; font-size: 12px; color: #444;
      background: #fafafa; border-top: 1px solid var(--border);
    }
    .done-pager { flex-wrap: wrap; }
    .pager-btn {
      border: 1px solid var(--border); background: #fff; color: #1a73e8;
      border-radius: 6px; padding: 4px 12px; font-size: 12px; cursor: pointer;
      min-width: 32px;
    }
    .pager-btn.active {
      background: #1a73e8; color: #fff; border-color: #1a73e8; cursor: default;
    }
    .table-scroll {
      overflow-x: auto;
      overflow-y: auto;
      /* Roughly the height of a header row + 10 data rows. Once a
         section holds more rows than that, it scrolls internally
         instead of growing the page. */
      max-height: 460px;
    }
    table.data-table {
      border-collapse: collapse;
      width: 100%;
      min-width: 720px;
    }
    table.data-table th {
      position: sticky;
      top: 0;
      z-index: 1;
      text-align: start;
      padding: 12px 14px;
      font-size: 13px;
      white-space: nowrap;
    }
    table.data-table td {
      padding: 10px 14px;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    table.data-table tbody tr:nth-child(even) {
      background: var(--row-alt);
    }
    table.data-table tbody tr:hover {
      background: #f0f4ff;
    }
    .empty-row {
      text-align: center;
      color: #888;
      padding: 24px !important;
      font-style: italic;
    }
    .pdf-cell {
      text-align: center;
      width: 60px;
    }
    .pdf-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #444;
      text-decoration: none;
    }
    .pdf-link:hover {
      color: #d32f2f;
    }
    .no-pdf {
      color: #bbb;
    }
    .id-cell {
      cursor: pointer;
      color: #1a73e8;
      border-bottom: 1px dotted #1a73e8;
      transition: color 0.15s ease;
    }
    .id-cell:hover {
      color: #0b57d0;
    }
    .id-cell.copied {
      color: #188038;
      border-bottom-color: #188038;
    }
    .tick-cell {
      text-align: center;
      width: 50px;
    }
    .tick-checkbox {
      width: 17px;
      height: 17px;
      cursor: pointer;
      accent-color: #1e8e3e;
    }
    tr.row-done td {
      color: #1e8e3e;
    }
    tr.row-done .id-cell {
      color: #1e8e3e;
      border-bottom-color: #1e8e3e;
    }
    tr.row-done .pdf-link {
      color: #1e8e3e;
    }
    .tick-checkbox-sent {
      width: 17px;
      height: 17px;
      cursor: pointer;
      accent-color: #000080;
    }
    /* Placed after the row-done rules so that if a row is ever both
       Done and أنجاز, the navy "Sent" styling takes visual priority. */
    tr.row-sent td {
      color: #000080;
      font-weight: 700;
    }
    tr.row-sent .id-cell {
      color: #000080;
      border-bottom-color: #000080;
    }
    tr.row-sent .pdf-link {
      color: #000080;
    }
    /* Once a row is marked أنجاز/Sent, its Done checkbox turns navy too,
       matching the rest of the row. */
    tr.row-sent .tick-checkbox {
      accent-color: #000080;
    }
    .banner {
      padding: 12px 16px; margin-bottom: 16px; border-radius: 8px;
      font-size: 14px; cursor: pointer;
    }
    .banner.error { background: #fdecea; color: #b3261e; border: 1px solid #f6c9c4; }
    .banner.info  { background: #e8f0fe; color: #1a56c4; border: 1px solid #c6dafc; }
    .login-view {
      min-height: 70vh; display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      background: #fff; padding: 28px 26px; border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12); width: 320px; max-width: 90vw;
      display: flex; flex-direction: column; gap: 14px;
    }
    .login-card h2 { margin: 0 0 4px; font-size: 18px; color: #333; }
    .login-card label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #444; }
    .login-card input {
      padding: 9px 11px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px;
    }
    .login-card button {
      margin-top: 4px; padding: 10px; border: none; border-radius: 6px;
      background: #1a73e8; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .login-card button:disabled { opacity: 0.6; cursor: default; }
    .login-error { margin: 0; color: #b3261e; font-size: 13px; }
    .whoami { font-size: 12px; color: #666; margin-inline-start: 8px; }
    .logout-btn {
      border: 1px solid var(--border); background: #fff; color: #444;
      border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer;
    }
    .summary-panel {
      background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      margin-bottom: 16px; overflow: hidden;
    }
    .summary-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 10px 14px; background: #f5f6f8; border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .summary-head input[type="date"] {
      padding: 6px 9px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px;
    }
    .summary-head-left { display: flex; align-items: center; gap: 8px; }
    .summary-toggle {
      width: 24px; height: 24px; padding: 0; line-height: 1;
      border: 1px solid var(--border); border-radius: 6px; background: #fff;
      color: #444; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    #summaryTable th { background: #37474f; color: #fff; }
  </style>
</head>
<body>
  <div id="banner" class="banner" hidden></div>

  <div id="loginView" class="login-view">
    <form id="loginForm" class="login-card">
      <h2>تسجيل الدخول</h2>
      <label>اسم المستخدم
        <input type="text" id="loginUser" autocomplete="username" required>
      </label>
      <label>كلمة المرور
        <input type="password" id="loginPass" autocomplete="current-password" required>
      </label>
      <button type="submit" id="loginBtn">دخول</button>
      <p id="loginError" class="login-error" hidden></p>
    </form>
  </div>

  <div id="app" hidden>
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="refreshBtn" class="refresh-btn" title="Refresh data" aria-label="Refresh data">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
        <span id="lastUpdated" class="whoami"></span>
        <h1>المباشرات والمرضيات والإجازات الي تم تحميلها على الموقع</h1>
        <span id="whoami" class="whoami"></span>
        <button id="logoutBtn" class="logout-btn" type="button">خروج</button>
      </div>
      <div class="filter-box">
        <label for="secretariatFilter">سكرتارية:</label>
        <select id="secretariatFilter">
          <option value="">All</option>
        </select>
      </div>
    </div>
    <div id="tabNav" class="tab-nav"></div>
    <div id="summaryPanel" class="summary-panel" hidden>
      <div class="summary-head">
        <span class="summary-head-left">
          <button id="summaryToggle" class="summary-toggle" type="button" aria-label="طي أو عرض الجدول">+</button>
          <strong>ملخص اليوم لكل سكرتارية</strong>
        </span>
        <input type="date" id="summaryDate">
      </div>
      <div id="summaryBody" class="table-scroll" hidden>
        <table class="data-table" id="summaryTable" aria-label="ملخص الأداء">
          <thead><tr>
            <th>السكرتارية</th><th>طباعة</th><th>أنجاز</th><th>تراجع</th>
            <th>أقدم طلب معلّق (ساعات)</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    <div id="tableWrap" class="table-wrap"></div>
  </div>

  <script>
    var TABS_CONFIG = <?!= tabsConfigJson ?>;
    var COLUMN_HEADERS = <?!= columnHeadersJson ?>;
    var TABS_DATA = {};

    var activeIndex = 0;
    var donePage = 0;              // pagination position in the طباعة (Done) table
    var DONE_DAYS_PER_PAGE = 3;    // how many calendar days of requests per page
    var secretariatFilterValue = '';

    // Indexes into each display row, matching COLUMN_HEADERS order:
    // Timestamp, Name, ID, Center, Summary Dropdown, سكرتارية, Code, PDF Links
    var ID_COLUMN_INDEX = 2;
    var SECRETARIAT_COLUMN_INDEX = 5;

    // Attach the change listener once. Rebuilding the <option> list (on
    // refresh) is handled separately by refreshSecretariatOptions() so we
    // don't stack up duplicate listeners every time data is refreshed.
    function setupSecretariatFilter() {
      var select = document.getElementById('secretariatFilter');
      select.addEventListener('change', function () {
        secretariatFilterValue = select.value;
        donePage = 0;
        renderTable();
      });
    }

    function refreshSecretariatOptions() {
      var select = document.getElementById('secretariatFilter');
      var previousValue = select.value;

      var seen = {};
      Object.keys(TABS_DATA).forEach(function (sheetName) {
        (TABS_DATA[sheetName] || []).forEach(function (row) {
          var v = row.cells[SECRETARIAT_COLUMN_INDEX];
          if (v) seen[v] = true;
        });
      });
      var values = Object.keys(seen).sort(function (a, b) { return a.localeCompare(b, 'ar'); });

      select.innerHTML = '<option value="">All</option>';
      values.forEach(function (v) {
        var opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        select.appendChild(opt);
      });

      // Keep the current selection if it's still a valid option after
      // refresh, otherwise fall back to "All".
      if (values.indexOf(previousValue) !== -1) {
        select.value = previousValue;
        secretariatFilterValue = previousValue;
      } else {
        select.value = '';
        secretariatFilterValue = '';
      }
    }

    function renderNav() {
      var nav = document.getElementById('tabNav');
      nav.innerHTML = '';
      TABS_CONFIG.forEach(function (tab, i) {
        var btn = document.createElement('button');
        btn.className = 'tab-btn' + (i === activeIndex ? ' active' : '');
        btn.textContent = tab.label;
        btn.style.background = tab.headerBg;
        btn.style.color = tab.headerColor;
        btn.onclick = function () {
          activeIndex = i;
          donePage = 0;
          renderNav();
          renderTable();
        };
        nav.appendChild(btn);
      });
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str === null || str === undefined ? '' : String(str);
      return div.innerHTML;
    }

    function escapeAttr(str) {
      return String(str).replace(/"/g, '&quot;');
    }

    function pdfIconCell(url) {
      if (!url || !/^https?:\/\//i.test(String(url))) return '<span class="no-pdf">&mdash;</span>';
      // href/target stay as a fallback for right-click "open in new tab" or if JS
      // fails to load; the click handler below intercepts normal clicks and forces
      // a real new browser window instead of a tab.
      return '<a class="pdf-link" href="' + escapeAttr(url) + '" target="_blank" rel="noopener noreferrer" title="Open PDF">' +
        '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
        '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>' +
        '<path d="M14 2v6h6" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>' +
        '</svg></a>';
    }

    // Force PDF links to open in a real separate browser window (not a same-browser
    // tab). window.open() with explicit width/height/left/top features makes browsers
    // spawn a popup window instead of a tab. Reusing the same window name ("pdfViewer")
    // means clicking a second PDF replaces the content of that one window rather than
    // piling up new windows; switch it to '_blank' below if you'd rather each click
    // open a brand new window.
    function openPdfWindow(url) {
      var w = Math.min(1000, screen.availWidth - 80);
      var h = Math.min(800, screen.availHeight - 80);
      var left = Math.round((screen.availWidth - w) / 2);
      var top = Math.round((screen.availHeight - h) / 2);
      var features = 'width=' + w + ',height=' + h + ',left=' + left + ',top=' + top +
        ',resizable=yes,scrollbars=yes,toolbar=no,menubar=no,location=no,status=no';
      var newWin = window.open(url, 'pdfViewer', features);
      if (newWin) {
        newWin.opener = null;
        newWin.focus();
      } else {
        // Popup blocked — fall back to a normal new tab so the user still gets the PDF.
        window.open(url, '_blank', 'noopener,noreferrer');
      }
    }

    function copyIdToClipboard(el) {
      var text = el.getAttribute('data-copy') || '';
      if (!text) return;

      var showCopied = function () {
        var original = el.textContent;
        el.classList.add('copied');
        el.textContent = 'Copied!';
        setTimeout(function () {
          el.classList.remove('copied');
          el.textContent = original;
        }, 900);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(showCopied).catch(function () {
          fallbackCopy_(text);
          showCopied();
        });
      } else {
        fallbackCopy_(text);
        showCopied();
      }
    }

    function fallbackCopy_(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand('copy'); } catch (err) { /* ignore */ }
      document.body.removeChild(ta);
    }

    // Builds one <table> (header + body) for a given tab/row set. Rows are
    // expected to already be in the right order (newest to oldest). No cap
    // on count here — once a section holds more than ~10 rows its container
    // (.table-scroll, see CSS) scrolls internally rather than hiding rows.
    // showSentColumn controls whether the "أنجاز" header + checkbox render
    // at all — it's only shown in the Done table (table 2), not Pending.
    function buildTableMarkup(tab, rows, emptyMessage, showSentColumn) {
      var headers = showSentColumn ? COLUMN_HEADERS : COLUMN_HEADERS.slice(0, COLUMN_HEADERS.length - 1);

      var html = '<table class="data-table" aria-label="' + escapeAttr(tab.label) + '"><thead><tr>';
      headers.forEach(function (h) {
        html += '<th style="background:' + tab.headerBg + ';color:' + tab.headerColor + ';">' + escapeHtml(h) + '</th>';
      });
      html += '</tr></thead><tbody>';

      if (rows.length === 0) {
        html += '<tr><td colspan="' + headers.length + '" class="empty-row">' + emptyMessage + '</td></tr>';
      } else {
        rows.forEach(function (row) {
          var cells = row.cells;
          var rowClasses = [row.done ? 'row-done' : '', row.sent ? 'row-sent' : ''].filter(Boolean).join(' ');
          var noCode = !row.code;
          html += '<tr class="' + rowClasses + '" data-sheet-row="' + row.sheetRow +
                  '" data-code="' + escapeAttr(row.code || '') + '">';
          // Last cell is always "PDF Links" (rendered as the paper icon below);
          // the ID column is a click-to-copy cell; everything else is plain text.
          for (var c = 0; c < cells.length - 1; c++) {
            if (c === ID_COLUMN_INDEX) {
              html += '<td><span class="id-cell" data-copy="' + escapeAttr(cells[c]) + '" title="Click to copy">' + escapeHtml(cells[c]) + '</span></td>';
            } else {
              html += '<td>' + escapeHtml(cells[c]) + '</td>';
            }
          }
          html += '<td class="pdf-cell">' + pdfIconCell(cells[cells.length - 1]) + '</td>';
          html += '<td class="tick-cell"><input type="checkbox" class="tick-checkbox" aria-label="تحديد كمنجز" ' +
                  (row.done ? 'checked ' : '') + (noCode ? 'disabled title="لا يمكن التتبع: لا يوجد Code" ' : '') + '/></td>';
          if (showSentColumn) {
            html += '<td class="tick-cell"><input type="checkbox" class="tick-checkbox-sent" aria-label="تحديد أنجاز" ' +
                    (row.sent ? 'checked ' : '') + (noCode ? 'disabled title="لا يمكن التتبع: لا يوجد Code" ' : '') + '/></td>';
          }
          html += '</tr>';
        });
      }

      html += '</tbody></table>';
      return html;
    }

    // opts (all optional): totalCount overrides the badge number (when `rows` is a
    // paginated slice); sentCount adds a navy "أنجاز N" badge; footerHtml is
    // appended after the table (the pager).
    function buildSectionMarkup(title, tab, rows, emptyMessage, showSentColumn, opts) {
      opts = opts || {};
      var badgeNum = (opts.totalCount != null) ? opts.totalCount : rows.length;
      var badges;
      if (opts.sentCount != null) {
        // done section: two parallel labelled badges — طباعة (green), أنجاز (navy)
        badges = '<span class="count-badge count-badge-done">طباعة ' + badgeNum + '</span>' +
                 ' <span class="count-badge count-badge-sent">أنجاز ' + opts.sentCount + '</span>';
      } else {
        badges = '<span class="count-badge">' + badgeNum + '</span>';
      }
      return '<div class="table-section">' +
        '<div class="table-section-title">' + (title ? escapeHtml(title) + ' ' : '') + badges + '</div>' +
        '<div class="table-scroll">' + buildTableMarkup(tab, rows, emptyMessage, showSentColumn) + '</div>' +
        (opts.footerHtml || '') +
        '</div>';
    }

    // Splits done rows into pages of DONE_DAYS_PER_PAGE calendar days each
    // (newest first). Returns { rows: <this page's rows>, pageCount, days: [...] }.
    function paginateDoneByDay(doneRows) {
      var order = [];
      var seen = {};
      doneRows.forEach(function (r) {
        var day = String(r.cells[0] || '').slice(0, 10) || '—';
        if (!seen[day]) { seen[day] = true; order.push(day); }
      });
      var pageCount = Math.max(1, Math.ceil(order.length / DONE_DAYS_PER_PAGE));
      if (donePage >= pageCount) donePage = pageCount - 1;
      if (donePage < 0) donePage = 0;
      var pageDays = order.slice(donePage * DONE_DAYS_PER_PAGE, donePage * DONE_DAYS_PER_PAGE + DONE_DAYS_PER_PAGE);
      var inPage = {};
      pageDays.forEach(function (d) { inPage[d] = true; });
      return {
        rows: doneRows.filter(function (r) { return inPage[String(r.cells[0] || '').slice(0, 10) || '—']; }),
        pageCount: pageCount,
        days: pageDays
      };
    }

    function donePagerHtml(page) {
      if (page.pageCount <= 1) return '';
      var out = '<div class="done-pager">';
      for (var i = 0; i < page.pageCount; i++) {
        out += '<button class="pager-btn' + (i === donePage ? ' active' : '') +
               '" data-done-page="' + i + '"' + (i === donePage ? ' disabled' : '') +
               '>' + (i + 1) + '</button>';
      }
      return out + '</div>';
    }

    // Each tab shows two tables: pending (Done not ticked) and completed
    // (Done ticked). All matching rows are included — once a table holds
    // more than ~10 rows it scrolls internally (see .table-scroll CSS)
    // rather than hiding anything. The underlying data from the server is
    // already sorted newest-to-oldest, and filtering below preserves that.
    // The "أنجاز" column only appears in the Done table — you mark a row
    // Done first, then mark it أنجاز/Sent from there.
    function renderTable() {
      var tab = TABS_CONFIG[activeIndex];
      var allRows = TABS_DATA[tab.sheetName] || [];
      if (secretariatFilterValue) {
        allRows = allRows.filter(function (row) { return row.cells[SECRETARIAT_COLUMN_INDEX] === secretariatFilterValue; });
      }

      var pendingRows = allRows.filter(function (row) { return !row.done; });
      var doneRows = allRows.filter(function (row) { return row.done; });

      var pendingEmpty = secretariatFilterValue ? 'No matching pending records' : 'No pending records';
      var doneEmpty = secretariatFilterValue ? 'No matching completed records' : 'No completed records yet';

      var donePageInfo = paginateDoneByDay(doneRows);
      var doneSentCount = doneRows.filter(function (r) { return r.sent; }).length;

      var wrap = document.getElementById('tableWrap');
      wrap.innerHTML =
        buildSectionMarkup('Pending', tab, pendingRows, pendingEmpty, false) +
        buildSectionMarkup('', tab, donePageInfo.rows, doneEmpty, true, {
          totalCount: doneRows.length,
          sentCount: doneSentCount,
          footerHtml: donePagerHtml(donePageInfo)
        });
    }

    // Updates the in-memory copy of TABS_DATA so the done/sent state survives
    // tab switches and re-renders without needing a server round trip. Matches
    // on the immutable Code and trusts the server's post-write {code, done, sent}
    // so Finding 3's un-tick cascade renders without a refresh.
    function updateLocalTickState(sheetName, code, updated) {
      var rows = TABS_DATA[sheetName] || [];
      for (var i = 0; i < rows.length; i++) {
        if (String(rows[i].code) === String(code)) {
          rows[i].done = updated.done;
          rows[i].sent = updated.sent;
          break;
        }
      }
    }

    document.getElementById('tableWrap').addEventListener('click', function (e) {
      var pagerBtn = e.target.closest('.pager-btn');
      if (pagerBtn) {
        if (!pagerBtn.disabled) {
          donePage = Number(pagerBtn.getAttribute('data-done-page'));
          renderTable();
        }
        return;
      }
      var link = e.target.closest('.pdf-link');
      if (link) {
        e.preventDefault();
        openPdfWindow(link.getAttribute('href'));
        return;
      }
      var idCell = e.target.closest('.id-cell');
      if (idCell) {
        copyIdToClipboard(idCell);
      }
    });

    // Config shared by both tick columns: "Done" (green, writes "Done" to
    // col J) and "أنجاز" (navy, writes "Sent" to col K). Same behavior for
    // both — just a different CSS class/row class/field/server function.
    var TICK_COLUMNS = {
      'tick-checkbox': { field: 'done', rowClass: 'row-done', serverFn: 'setRowDone' },
      'tick-checkbox-sent': { field: 'sent', rowClass: 'row-sent', serverFn: 'setRowSent' }
    };

    document.getElementById('tableWrap').addEventListener('change', function (e) {
      var checkbox = e.target.closest('.tick-checkbox, .tick-checkbox-sent');
      if (!checkbox) return;

      var config = TICK_COLUMNS[checkbox.classList.contains('tick-checkbox-sent') ? 'tick-checkbox-sent' : 'tick-checkbox'];
      var tr = checkbox.closest('tr');
      var code = tr.getAttribute('data-code');
      var sheetRow = tr.getAttribute('data-sheet-row');
      var sheetName = TABS_CONFIG[activeIndex].sheetName;
      var checked = checkbox.checked;

      // Color the row immediately for feedback; the row itself only moves
      // between the Pending/Done tables once the write is confirmed and
      // renderTable() rebuilds both sections.
      tr.classList.toggle(config.rowClass, checked);
      checkbox.disabled = true;

      google.script.run
        .withSuccessHandler(function (updated) {
          updateLocalTickState(sheetName, code, updated);
          renderTable();
        })
        .withFailureHandler(function (err) {
          checkbox.disabled = false;
          checkbox.checked = !checked;
          tr.classList.toggle(config.rowClass, !checked);
          var msg = (err && err.message) ? err.message : String(err);
          if (String(msg).indexOf('AUTH') !== -1) {
            try { localStorage.removeItem('usd_token'); } catch (e) {}
            showLogin('انتهت الجلسة. سجّل الدخول من جديد.');
          } else if (String(msg).indexOf('NOT_YOUR_ROW') !== -1) {
            showBanner('لا يمكنك تعديل صف سكرتارية أخرى.', 'error');
          } else if (String(msg).indexOf('DONE_FIRST') !== -1) {
            showBanner('حدد "طباعة" أولاً قبل "أنجاز".', 'error');
          } else if (/NOT_FOUND|AMBIGUOUS|NO_CODE/.test(String(msg))) {
            showBanner('تعذّر تحديد الصف. اضغط تحديث ثم أعد المحاولة.', 'error');
          } else {
            showBanner('تعذّر الحفظ: ' + msg, 'error');
          }
        })[config.serverFn](SESSION.token, sheetName, code, Number(sheetRow), checked);
    });

    function refreshData() {
      if (!document.getElementById('refreshBtn').classList.contains('spinning')) loadData(false);
    }

    document.getElementById('refreshBtn').addEventListener('click', refreshData);

    var SESSION = { token: null, name: null, role: null };

    function showBanner(message, kind) {
      var b = document.getElementById('banner');
      b.textContent = message;
      b.className = 'banner ' + (kind === 'info' ? 'info' : 'error');
      b.hidden = false;
      clearTimeout(showBanner._t);
      showBanner._t = setTimeout(clearBanner, 6000);
    }
    function clearBanner() { document.getElementById('banner').hidden = true; }
    document.getElementById('banner').addEventListener('click', clearBanner);

    function showLogin(msg) {
      document.getElementById('app').hidden = true;
      document.getElementById('loginView').hidden = false;
      var el = document.getElementById('loginError');
      if (msg) { el.textContent = msg; el.hidden = false; } else { el.hidden = true; }
    }

    function doEnterDashboard() {
      document.getElementById('loginView').hidden = true;
      document.getElementById('app').hidden = false;
      enterDashboard(); // defined below; Task 11 fills the body
    }

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var u = document.getElementById('loginUser').value;
      var p = document.getElementById('loginPass').value;
      var btn = document.getElementById('loginBtn');
      btn.disabled = true;
      google.script.run
        .withSuccessHandler(function (res) {
          btn.disabled = false;
          if (res && res.ok) {
            SESSION = { token: res.token, name: res.name, role: res.role };
            try { localStorage.setItem('usd_token', res.token); } catch (err) {}
            document.getElementById('loginPass').value = '';
            doEnterDashboard();
          } else if (res && res.error === 'locked') {
            showLogin('تم قفل الحساب مؤقتاً لكثرة المحاولات. حاول بعد ١٥ دقيقة.');
          } else {
            showLogin('اسم المستخدم أو كلمة المرور غير صحيحة.');
          }
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          showLogin('تعذّر تسجيل الدخول: ' + (err && err.message ? err.message : err));
        })
        .login(u, p);
    });

    function tryResume() {
      var saved = null;
      try { saved = localStorage.getItem('usd_token'); } catch (err) {}
      if (!saved) { showLogin(); return; }
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.ok) {
            SESSION = { token: saved, name: res.name, role: res.role };
            doEnterDashboard();
          } else {
            try { localStorage.removeItem('usd_token'); } catch (err) {}
            showLogin();
          }
        })
        .withFailureHandler(function () { showLogin(); })
        .resumeSession(saved);
    }

    function enterDashboard() {
      document.getElementById('whoami').textContent = SESSION.name || '';
      var filterBox = document.querySelector('.filter-box');
      if (filterBox) filterBox.style.display = (SESSION.role === 'admin') ? '' : 'none';
      var summary = document.getElementById('summaryPanel');
      if (summary) summary.hidden = (SESSION.role !== 'admin');
      applySummaryCollapsed();

      setupSecretariatFilter();
      loadData(true);
    }

    function setLastUpdated() {
      var el = document.getElementById('lastUpdated');
      if (!el) return;
      var d = new Date();
      var hh = ('0' + d.getHours()).slice(-2);
      var mm = ('0' + d.getMinutes()).slice(-2);
      el.textContent = 'آخر تحديث ' + hh + ':' + mm;
    }

    function loadData(initial) {
      var btn = document.getElementById('refreshBtn');
      btn.classList.add('spinning');
      var runner = google.script.run
        .withSuccessHandler(function (res) {
          btn.classList.remove('spinning');
          TABS_DATA = (res && res.tabsData) ? res.tabsData : (res || {});
          donePage = 0;
          refreshSecretariatOptions();
          renderNav();
          renderTable();
          setLastUpdated();
          if (SESSION.role === 'admin' && typeof loadSummary === 'function') loadSummary();
        })
        .withFailureHandler(function (err) {
          btn.classList.remove('spinning');
          var msg = (err && err.message) ? err.message : String(err);
          if (String(msg).indexOf('AUTH') !== -1) {
            try { localStorage.removeItem('usd_token'); } catch (e) {}
            showLogin('انتهت الجلسة. سجّل الدخول من جديد.');
          } else {
            showBanner('تعذّر تحميل البيانات: ' + msg, 'error');
          }
        });
      if (initial) runner.getBootstrapData(SESSION.token);
      else runner.refreshTabsData(SESSION.token);
    }

    function loadSummary() {
      var dateInput = document.getElementById('summaryDate');
      var dateStr = dateInput.value || '';
      google.script.run
        .withSuccessHandler(function (res) {
          if (dateInput && res && res.date && !dateInput.value) dateInput.value = res.date;
          renderSummary(res);
        })
        .withFailureHandler(function (err) {
          showBanner('تعذّر تحميل الملخص: ' + (err && err.message ? err.message : err), 'error');
        })
        .getAdminSummary(SESSION.token, dateStr);
    }

    function renderSummary(res) {
      var tbody = document.querySelector('#summaryTable tbody');
      tbody.innerHTML = '';
      var rows = (res && res.rows) || [];
      if (rows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-row">لا يوجد نشاط لهذا اليوم</td></tr>';
        return;
      }
      rows.forEach(function (r) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + escapeHtml(r.secretary) + '</td>' +
          '<td>' + r.done + '</td>' +
          '<td>' + r.sent + '</td>' +
          '<td>' + r.untick + '</td>' +
          '<td>' + r.oldestPendingHours + '</td>';
        tbody.appendChild(tr);
      });
    }

    document.getElementById('summaryDate').addEventListener('change', loadSummary);

    // Collapse / expand the summary table; remembered per browser.
    // Default is collapsed — only an explicit '0' keeps it open.
    function applySummaryCollapsed() {
      var collapsed = true;
      try { collapsed = localStorage.getItem('usd_summary_collapsed') !== '0'; } catch (e) {}
      var body = document.getElementById('summaryBody');
      var btn = document.getElementById('summaryToggle');
      if (body) body.hidden = collapsed;
      if (btn) btn.textContent = collapsed ? '+' : '−';
    }
    document.getElementById('summaryToggle').addEventListener('click', function () {
      var body = document.getElementById('summaryBody');
      var collapsed = !body.hidden;
      body.hidden = collapsed;
      this.textContent = collapsed ? '+' : '−';
      try { localStorage.setItem('usd_summary_collapsed', collapsed ? '1' : '0'); } catch (e) {}
    });

    tryResume();

    document.getElementById('logoutBtn').addEventListener('click', function () {
      var t = SESSION.token;
      SESSION = { token: null, name: null, role: null };
      try { localStorage.removeItem('usd_token'); } catch (err) {}
      if (t) google.script.run.logout(t);
      TABS_DATA = {};
      document.getElementById('tableWrap').innerHTML = '';
      var st = document.querySelector('#summaryTable tbody');
      if (st) st.innerHTML = '';
      showLogin();
    });
  </script>
</body>
</html>
